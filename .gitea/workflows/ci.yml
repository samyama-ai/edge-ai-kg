# Runs the suite and ruff on every push and pull request (#2).
#
# The awkward part is not running pytest -- it is making a green run mean
# something. 13 test modules `pytest.skip` when `data/` is absent, so a
# workflow that omitted the download step would pass while testing almost
# nothing. `--no-skips` (see conftest.py) turns a *fixture* skip into a
# failure, so this job cannot go green without a real graph behind it.
#
# ## Why there is no `actions/setup-python` here
#
# Every run of this workflow failed, from the first (#1, 2026-09-07) to #218,
# almost all of them in 7-14s. Job logs need repository-owner rights, so the
# cause was found by splitting the question across jobs and reading their
# statuses -- see `runner-probe.yml`, which is kept until this is green and
# then deleted. Measured on this runner:
#
#   bare-run (default shell)  success    setup-python-only        FAILURE
#   has-bash                  success    has-pip                  FAILURE
#   checkout-only             success    ensurepip-gives-pip      FAILURE
#   has-python3               success    venv-gives-pip           FAILURE
#   has-venv                  success
#   python-is-at-least-3-11   success    apt-gives-pip            success
#
# The image ships a Python new enough for this project and **no pip**, which is
# the ordinary Debian split: `ensurepip` is stripped, so `python3 -m venv`
# cannot bootstrap one either, and `actions/setup-python@v5` dies at 3s before
# anything else runs. `apt-get install python3-pip python3-venv` is what
# works, so that is what this does.
#
# Two things the previous version of this file believed, both now disproved:
# the runner is not Alpine (apt-get works), and bash is present (`bare-run`
# under the default shell and `has-bash` both pass). The `shell: sh` default it
# carried was reasoning from a 0s failure that had a different cause, so it is
# gone.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # `python3-pip` and `python3-venv` because the image has neither, and the
      # rest because `samyama` publishes no manylinux wheel for every host: on
      # a miss, pip builds the Rust extension from source, which fails first on
      # a missing linker and then on zstd-sys bindgen not finding stddef.h.
      # clang supplies the builtin headers; see CLAUDE.md.
      - name: Install build prerequisites
        run: |
          set -eu
          # `sudo` is not a given -- act_runner images usually run as root and
          # ship none. `apt-gives-pip` in the probe passed with this same
          # branch, so one of the two paths works here.
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi
          $SUDO apt-get update -qq
          $SUDO apt-get install -y --no-install-recommends \
            python3-pip python3-venv python3-dev build-essential clang libclang-dev

      # A virtualenv rather than the system Python: Debian marks its own
      # interpreter externally managed (PEP 668), so `pip install -e .` against
      # it is refused. Everything below runs the venv's binaries explicitly, so
      # there is no `activate` to forget.
      - name: Create the virtualenv
        run: |
          set -eu
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      # The cargo build is the slowest step by far (~3 min cold), and only
      # happens at all when pip finds no wheel for this host.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install
        run: .venv/bin/python -m pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      # Fetches three public sources and generates the fleet into ./data.
      # Nothing else works until this has run.
      - name: Build the dataset
        run: .venv/bin/python -m etl.download_data

      # Fail if the fixtures skipped: a suite that skips is a suite that did
      # not run, and this job exists to notice that.
      - name: Test
        run: .venv/bin/pytest -q --no-skips

      # Belt and braces. If --no-skips ever regresses, a suite that collected
      # far fewer tests than expected still fails here rather than passing
      # quietly. The floor is deliberately well below the current count so it
      # does not need editing for every added test.
      - name: Assert the suite actually ran
        run: |
          COUNT=$(.venv/bin/pytest -q --collect-only 2>/dev/null | tail -1 | grep -oE '^[0-9]+')
          echo "collected ${COUNT} tests"
          if [ "${COUNT:-0}" -lt 100 ]; then
            echo "::error::only ${COUNT} tests collected; expected 100+"
            exit 1
          fi
