# Runs the suite and ruff on every push and pull request (#2).
#
# The awkward part is not running pytest -- it is making a green run mean
# something. 13 test modules `pytest.skip` when `data/` is absent, so a
# workflow that omitted the download step would pass while testing almost
# nothing. `--no-skips` (see conftest.py) turns a *fixture* skip into a
# failure, so this job cannot go green without a real graph behind it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        # `sh`, not the default `bash`. Evidence: every `uses:` step succeeded
        # while the *first* `run:` step failed in 0s -- first `apt-get`, then,
        # once a plain-`echo` probe was put ahead of it, the probe itself. A
        # step that only echoes cannot fail in zero seconds unless the shell
        # never starts, and `uses:` working means the container and node are
        # fine. Alpine-based images ship `sh` and no `bash`, which fits exactly.
        #
        # Everything below is POSIX: no arrays, no [[ ]], no pipefail.
        shell: sh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Printed before anything can fail, so a future red run says *where* it
      # is running rather than only that it stopped. The first failure of this
      # workflow was a 0s step with no output, and this is what would have
      # identified it in one look.
      - name: Runner environment
        run: |
          echo "shell  : $0"
          echo "user   : $(id -un 2>/dev/null || echo '?') (uid $(id -u))"
          echo "sudo   : $(command -v sudo || echo 'none')"
          echo "apt-get: $(command -v apt-get || echo 'none')"
          echo "apk    : $(command -v apk || echo 'none')"
          echo "bash   : $(command -v bash || echo 'none')"
          echo "python : $(python3 --version 2>&1 || echo 'none')"
          echo "os     : $(head -1 /etc/os-release 2>/dev/null || uname -a)"

      # Kept as a fallback, not because it is needed today. Since #56 raised
      # the floor to `samyama` 1.7.1 -- which publishes
      # `samyama-1.7.1-cp38-abi3-manylinux_2_38_x86_64.whl` -- pip takes the
      # wheel on this runner and builds nothing. It matters again if pip ever
      # resolves the sdist (a non-x86_64 runner, or glibc older than 2.38):
      # 0.6.1 shipped only a macOS wheel, and a bare runner then fails twice,
      # first on a missing linker, then on zstd-sys bindgen not finding
      # stddef.h. clang supplies the builtin headers; see CLAUDE.md.
      - name: Install build prerequisites
        run: |
          set -eu
          # `sudo` is not a given -- act_runner images usually run as root and
          # ship none -- and neither is the package manager. The probe above
          # prints which of these exist, so a failure here is legible.
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi
          if command -v apt-get >/dev/null; then
            $SUDO apt-get update -qq
            $SUDO apt-get install -y --no-install-recommends \
              build-essential python3-dev clang libclang-dev
          elif command -v apk >/dev/null; then
            $SUDO apk add --no-cache build-base python3-dev clang clang-dev
          else
            echo "no apt-get and no apk; see the Runner environment step above" >&2
            exit 1
          fi

      # The cargo build is the slowest step by far (~3 min cold).
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Fetches three public sources and generates the fleet into ./data.
      # Nothing else works until this has run.
      - name: Build the dataset
        run: python -m etl.download_data

      # Fail if the fixtures skipped: a suite that skips is a suite that did
      # not run, and this job exists to notice that.
      - name: Test
        run: pytest -q --no-skips

      # Belt and braces. If --no-skips ever regresses, a suite that collected
      # far fewer tests than expected still fails here rather than passing
      # quietly. The floor is deliberately well below the current count so it
      # does not need editing for every added test.
      - name: Assert the suite actually ran
        run: |
          COUNT=$(pytest -q --collect-only 2>/dev/null | tail -1 | grep -oE '^[0-9]+')
          echo "collected ${COUNT} tests"
          if [ "${COUNT:-0}" -lt 100 ]; then
            echo "::error::only ${COUNT} tests collected; expected 100+"
            exit 1
          fi
