[project]
name = "edge-ai-kg"
version = "0.1.0"
description = "Edge AI deployment knowledge graph (boards, accelerators, ONNX kernels, quantized models) built on Samyama"
requires-python = ">=3.10"
dependencies = [
    "samyama>=0.6.0",
    "requests>=2.31",
    "rich>=13.0",
    "click>=8.0",
    "fastmcp>=0.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
include = ["etl*", "mcp_server*", "benchmarks*", "demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
exclude = [".venv", "data"]

[tool.ruff.lint]
# Pinned explicitly rather than left to ruff's defaults: `ruff>=0.1.0` spans
# versions whose default rule set differs, so without this CI would start
# failing on a ruff release rather than on a change to this repo. This is the
# set that was already firing, minus the rules this repo has decided against.
select = ["E4", "E7", "E9", "F", "I", "UP", "ISC", "PERF", "FURB", "RUF", "BLE", "S",
          "PLR0124"]  # comparison-with-itself, for the NaN check in helpers.py

ignore = [
    # Every broad catch here sits on a call into the engine, which raises
    # untyped errors -- `RuntimeError("Query error: ...")` -- for anything from
    # unsupported Cypher to an unreachable server. There is no narrower class to
    # catch, and the callers deliberately continue: the loader reports a skipped
    # schema statement, the benchmark records a per-query failure, the tests
    # skip. See docs/engine-notes.md.
    "BLE001",
    # The generator is seeded and reproducible by design; `random` is the point,
    # not a security weakness. Same seed, same graph.
    "S311",
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the test suite's job, and its cleanup between fixtures is
# best-effort by design -- a failure to delete leftover nodes must not mask the
# assertion the test exists to make.
# PERF203: the catalog sweep catches per-query so it can report every
# failure at once rather than stopping at the first.
"tests/*" = ["S101", "S110", "PERF203"]
