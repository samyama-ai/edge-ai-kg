[project]
name = "edge-ai-kg"
version = "0.1.0"
description = "Edge AI deployment knowledge graph (boards, accelerators, ONNX kernels, quantized models) built on Samyama"
requires-python = ">=3.10"
dependencies = [
    # >=1.7.1 is a floor, not a preference: 0.6.x fails engine notes 10 and 11
    # (a second WITH's alias, and sum(CASE) typing) and panics the HNSW index on
    # near-duplicate vectors. 1.7.1 matches the 1.7.0 server the notes were
    # measured against. See #56.
    #
    # <1.9 is a ceiling, and a stopgap rather than a preference. **`EA17` and
    # `EA21` do not run on 1.9.0.** Its planner refuses an unbounded
    # variable-length pattern that produces more than a million paths:
    #
    #   Query error: [Samyama.ClientError.Statement.PlanningFailed] Planning
    #   error: variable-length pattern produced more than 1000000 paths; bound
    #   it with an upper hop limit or a more selective start
    #
    # Both queries walk `NEXT_STAGE*0..` with no bound, over a stage graph that
    # contains cycles (`tests/test_blast_radius_semantics.py` names one), so the
    # path count explodes exactly as that message describes. Measured: 11 tests
    # fail on 1.9.0 and none on 1.7.1, which is why CI failed while every
    # developer's machine passed -- CI installs what PyPI has today.
    #
    # The ceiling buys reproducibility, not a fix. The fix is to bound those
    # walks, which changes what they answer (`EA17`'s depth *is* the answer), so
    # it is a query-design decision rather than a version bump. Until that is
    # taken, raising this ceiling means shipping a catalog with two queries that
    # cannot run.
    "samyama>=1.7.1,<1.9",
    "requests>=2.31",
    "rich>=13.0",
    "click>=8.0",
    "fastmcp>=0.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.16,<0.17",
    # `tomllib` is 3.11+, and this project supports 3.10.
    # `tests/test_engine_version.py` reads this file to check the samyama
    # floor; without a reader it had to skip, and a `skipif` is a setup-phase
    # skip that `--no-skips` turns into a failure -- so a developer on 3.10
    # reproducing a CI failure got a hard error about `etl.download_data`
    # instead of the thing they were chasing.
    "tomli; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["etl*", "mcp_server*", "benchmarks*", "demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
exclude = [".venv", "data"]

[tool.ruff.lint]
# Pinned explicitly rather than left to ruff's defaults: `ruff>=0.1.0` spans
# versions whose default rule set differs, so without this CI would start
# failing on a ruff release rather than on a change to this repo. This is the
# set that was already firing, minus the rules this repo has decided against.
select = ["E4", "E7", "E9", "F", "I", "UP", "ISC", "PERF", "FURB", "RUF", "BLE", "S",
          "PLR0124"]  # comparison-with-itself, for the NaN check in helpers.py

[tool.ruff.lint.per-file-ignores]
# Scoped per file rather than ignored globally: each exemption below is a
# property of that module, not of the repo, and a broad `except Exception` added
# somewhere new -- `mcp_server/server.py`, say, where a narrower class may exist
# and swallowing is likelier to be a bug -- should still be reported.
#
# BLE001 is exempted in three places -- the two modules directly below, and
# tests/ further down. In all of them the broad catch sits on a call into the
# engine, which raises untyped errors (`RuntimeError("Query error: ...")`) for
# anything from unsupported Cypher to an unreachable server. There is no
# narrower class to catch, and each caller deliberately continues: the loader
# reports a skipped schema statement, the benchmark records a per-query
# failure, the tests skip.
"etl/loader.py" = ["BLE001"]
"benchmarks/run_benchmark.py" = ["BLE001"]

# S311: the generator's `random` is seeded reproducibility -- same seed, same
# graph -- not a weak RNG standing in for a secure one.
"etl/generate.py" = ["S311"]

# S311 for the same reason: the probe's vectors and hold-out are seeded so the
# panic and the collision counts reproduce exactly. S324: md5 is used as a
# cheap hash to bucket character n-grams into embedding dimensions -- it is a
# hashing-trick index, never a digest of anything that matters.
# S311/S324 as above. S603: the one subprocess call runs `sys.executable` with a
# literal `-c` script and a metric name from a hardcoded tuple in this file --
# there is no untrusted input, and the isolation is the point (each metric needs
# a process the previous panic has not touched).
"benchmarks/vector_probe.py" = ["S311", "S324", "S603"]

# S603: the fixture module runs `sys.executable -m pytest` over a copy of the
# root `conftest.py` in a tmp directory, to check *where* the engine skip
# happens -- the argument list is literal and the directory is pytest's own
# `tmp_path`. Running it is the only way to pin that property; importing the
# fixture cannot see the difference.
"tests/test_embedded_engine_fixture.py" = ["S603"]

# S603: the cyclic-chain check runs `sys.executable -c <literal probe>` so the
# timeout can kill it. A worker thread cannot be killed, and a join that timed
# out would leave the query running for the rest of the session -- the failure
# this check reports would itself corrupt what follows. No input is untrusted:
# the argument list is literal and the script is a constant in that file.
"tests/test_blast_radius_semantics.py" = ["S603"]

# S603/S607: `tests/test_site_spine.py` runs
# `git show <PRE_SITE_COMMIT>:etl/generate.py` -- a fixed commit named in that
# file, not a moving ref -- to compare this branch's fleet against the
# generator before `Site` existed. A moving ref would compare against whatever
# `main` happens to be, which is the comparison rotting rather than holding.
# The argument list is literal, the only variable is a ref this file names, and
# `git` is resolved from PATH because a test that hardcoded /usr/bin/git would
# skip on half the machines it runs on. It is the alternative to pinning
# absolute cost-model figures, which rot when the upstream catalogue moves.
"tests/test_site_spine.py" = ["S603", "S607"]

# BLE001/PERF203: the catalog sweep catches per-query so it reports every
# failure rather than stopping at the first -- the same reason
# `benchmarks/run_benchmark.py` is exempt, and the engine raises untyped errors
# so there is no narrower class than `Exception` to catch.
# S602: `--restart-cmd` is a shell command the operator types to restart their
# own server (`docker restart x`, `systemctl restart y`). Shell is the point --
# there is no fixed argv to pass instead -- and the string comes from the person
# running the benchmark, not from data.
"benchmarks/snapshot.py" = ["BLE001", "PERF203", "S602"]

# BLE001/PERF203: the sweep catches per query so it reports every result, and
# both engines raise untyped errors. S110: the catalog warm-up pass ignores
# failures on purpose -- a query one engine refuses must still warm the other,
# and a warm-up that aborted on the first refusal would leave the timed sweep
# measuring a cold process. No S310 here: this module opens no URLs, and an
# ignore describing another file is worse than none.
"benchmarks/compare_neo4j.py" = ["BLE001", "PERF203", "S110"]

# BLE001: `timed` catches whatever either engine raises, because a failure is a
# result here -- one refusal must not take the other fifteen queries with it,
# and both engines raise untyped errors. No PERF203: the `try` wraps the repeat
# loops rather than sitting inside them, so there is nothing for it to flag.
"benchmarks/sweep.py" = ["BLE001"]

# S310: the Neo4j URL is typed by whoever runs the comparison, like `--url`
# everywhere else here; there is no untrusted input to sanitise. All HTTP in
# this comparison goes through this module.
"benchmarks/neo4j_client.py" = ["S310"]

# The engine-notes probe, three modules: `engine_notes_probe.py` (the CLI),
# `engine_notes_harness.py` and `engine_notes_cases.py`. BLE001 in six places
# across them: the reset (re-raised as `ResetFailed`, never swallowed); the two
# catches in `parses` that separate "refuses this statement" from "not
# answering at all"; note 6's attempted `DROP CONSTRAINT`; the version label,
# read in a `try` so a renamed field cannot stop the run; and the per-probe
# guard in `main` that turns an unexpected failure into one ERROR verdict
# instead of ending the sweep. All six sit on a call into the engine, which
# raises untyped errors (`RuntimeError("Query error: ...")`) for anything from
# unsupported Cypher to an unreachable server. There is no narrower class.
#
# No S110 here. An earlier version of this comment claimed one for "a reset
# that fails must not mask the note", but nothing in these files swallows an
# exception with `pass`: a failed reset raises `ResetFailed`, which `main`
# turns into an UNSOUND verdict. The ignore was unused and its stated reason
# described a mechanism the files do not use.
"benchmarks/engine_notes_*.py" = ["BLE001"]

# S101: asserts are what a test is. S110: cleanup between fixtures is
# best-effort by design -- failing to delete leftover nodes must not mask the
# assertion the test exists to make. PERF203: the catalog sweep catches
# per-query so it can report every failure rather than stopping at the first.
"tests/*" = ["S101", "S110", "PERF203", "BLE001"]
